name: Bug report
description: Crash, wrong output, missed finding (false negative) or CLI problem.
title: "fix: "
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command line and the smallest pipeline that shows the problem. Replace real secrets.
      placeholder: |
        concourse-lint check pipeline.yml
        ```yaml
        jobs: ...
        ```
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output
      render: text
  - type: input
    id: version
    attributes:
      label: concourse-lint version
      placeholder: v0.2.0 or commit hash
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and editor (if LSP)
