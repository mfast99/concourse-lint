# CS005: task image with a quoted "latest".
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: test
  plan:
  - get: repo
  - task: unit
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: golang
          tag: "latest"       # want CS005
      inputs: [{name: repo}]
      run: {path: repo/ci/unit.sh}
