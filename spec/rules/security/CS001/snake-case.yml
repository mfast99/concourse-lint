# CS001: the base case with snake_case keys. Secret-like: the last word is
# password, passwd, secret or token, or the last two are private/api/access/
# secret + key.
resources:
- name: api
  type: mock
  source:
    password: hunter2         # want CS001
    passwd: x                 # want CS001
    client_secret: s3cr3t     # want CS001
    auth_token: plain-value   # want CS001
    private_key: not-a-key    # want CS001
    api_key: abc123           # want CS001
    access_key: abc123        # want CS001
    secret_access_key: xyz    # want CS001

jobs:
- name: test
  plan:
  - get: api
