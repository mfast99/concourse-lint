# CS004: only the whole hostname "localhost" is exempt, not a host that
# merely starts with it.
resources:
- name: repo
  type: git
  source: {uri: "http://localhost.evil.example/app.git"}   # want CS004
- name: other
  type: git
  source: {uri: "http://127.0.0.1.nip.io/app.git"}   # want CS004

jobs:
- name: test
  plan:
  - get: repo
  - get: other
