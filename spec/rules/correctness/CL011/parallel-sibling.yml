# CL011: a sibling inside in_parallel is not available yet.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: build
  plan:
  - in_parallel:
    - get: repo
    - task: compile
      config:
        platform: linux
        image_resource:
          type: registry-image
          source: {repository: golang, tag: "1.24"}
        inputs:
        - name: repo            # want CL011
        run: {path: repo/ci/compile.sh}
