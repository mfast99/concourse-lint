# CL008: a load_var with across defines its variable only inside the across
# step ("undefined vars: .:version" afterwards).
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: deploy
  plan:
  - get: repo
  - load_var: version
    file: repo/versions/((.:region))
    across:
    - var: region
      values: [eu-central-1, eu-west-1]
  - task: deploy
    file: repo/ci/deploy.yml
    params:
      VERSION: ((.:version))  # want CL008
