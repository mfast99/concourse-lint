# CL021: a literal tab inside a double-quoted string, e.g. pasted from a
# terminal. Concourse keeps it, but it is almost never meant.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: test
  plan:
  - get: repo
  - task: test
    file: repo/ci/test.yml
    params:
      MESSAGE: "build	done"   # want CL021
