# CL015: rule IDs are case-sensitive; "cs006" suppresses nothing.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: build
  plan:
  - get: repo
  - task: image
    # concourse-lint:ignore cs006   # want CL015
    privileged: true                # want CS006
    file: repo/ci/build.yml
