# CL001: values in steps that fly rejects: a cache ttl that is no duration,
# max_in_flight of across that is neither a number nor "all", and a version
# that is neither latest, every nor a mapping of version fields.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: test
  plan:
  - get: repo
    version: [abc123]         # want CL001
  - task: unit
    file: repo/ci/unit.yml
    across:
    - var: go
      values: ["1.21", "1.22"]
      max_in_flight: some     # want CL001
  - task: build
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: golang, tag: "1.22"}
      inputs: [{name: repo}]
      caches: [{path: go, ttl: soon}]   # want CL001
      run: {path: make}
