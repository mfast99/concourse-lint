# CL004 must NOT fire here: a custom type defined after its first use, a type
# built on another custom type, and a custom type that overrides a built-in.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}
- name: thing
  type: derived
  source: {}

resource_types:
- name: derived
  type: base
  source: {repository: example/derived, tag: "1.0.0"}
- name: base
  type: registry-image
  source: {repository: example/base, tag: "1.0.0"}
- name: git
  type: registry-image
  source: {repository: concourse/git-resource, tag: "1.17.0"}

jobs:
- name: test
  plan:
  - get: repo
  - get: thing
