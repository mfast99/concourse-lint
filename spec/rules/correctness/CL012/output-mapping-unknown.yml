# CL012: output_mapping names an output the inline task does not declare.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: build
  plan:
  - get: repo
  - task: compile
    output_mapping:
      binary: compiled
      log: compile-log          # want CL012
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: golang, tag: "1.24"}
      inputs: [{name: repo}]
      outputs: [{name: binary}]
      run: {path: repo/ci/compile.sh}
