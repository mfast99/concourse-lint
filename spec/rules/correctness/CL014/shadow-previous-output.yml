# CL014: a second task produces an output with the same name as an earlier
# task's output, without taking it as input.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: build
  plan:
  - get: repo
  - task: compile
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: golang, tag: "1.24"}
      inputs: [{name: repo}]
      outputs: [{name: dist}]
      run: {path: repo/ci/compile.sh}
  - task: docs
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: alpine, tag: "3.20"}
      inputs: [{name: repo}]
      outputs:
      - name: dist              # want CL014
      run: {path: repo/ci/docs.sh}
