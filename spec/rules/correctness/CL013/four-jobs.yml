# CL013: a longer cycle (a -> b -> c -> d -> a) with a block list. Job e
# starts the chain but is not part of the cycle.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: e
  plan: [{get: repo}]
- name: a
  plan:
  - get: repo
    passed:
    - e
    - d                       # want CL013
- name: b
  plan: [{get: repo, passed: [a]}]   # want CL013
- name: c
  plan: [{get: repo, passed: [b]}]   # want CL013
- name: d
  plan: [{get: repo, passed: [c]}]   # want CL013
