# CB001: base is used by derived, but nothing uses derived. Only the end of
# the chain is reported.
resource_types:
- name: base
  type: registry-image
  source: {repository: example/base, tag: "1.0.0"}
- name: derived               # want CB001
  type: base
  source: {repository: example/derived, tag: "1.0.0"}

resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: test
  plan: [{get: repo}]
