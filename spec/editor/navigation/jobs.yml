# Go to definition and find references for jobs: passed: and the jobs of a
# group. A glob refers to every job it matches, so definition on a glob
# lists all of them, and the references of a job include the globs.
resources:
- name: repo
  type: git
  source: {uri: https://github.com/example/app.git}

jobs:
- name: build
#        ^ references 18:14 23:14 28:10 34:10
  plan:
  - get: repo
- name: deploy-staging
#           ^ references 23:21 31:10 34:10
  plan:
  - get: repo
    passed: [build]
#             ^ definition 10:9
- name: deploy-prod
  plan:
  - get: repo
    passed: [build, deploy-staging]
#                          ^ definition 14:9

groups:
- name: ci
  jobs: [build]
#          ^ definition 10:9
- name: deploy
  jobs: ["deploy-*"]
#           ^ definition 14:9 20:9
- name: all
  jobs: ["*"]
#         ^ definition 10:9 14:9 20:9
